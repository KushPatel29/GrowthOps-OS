version: 2

models:
  - name: stg_persons
    description: One pseudonymous person per canonical GrowthOps key.
    columns:
      - name: person_key
        data_tests: [unique, not_null]
  - name: stg_identity_links
    description: Hashed external identifiers with evidence and confidence.
    columns:
      - name: person_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_persons')
                field: person_key
  - name: stg_lifecycle_transitions
    description: Accepted stage history sourced from immutable lifecycle events.
    columns:
      - name: transition_id
        data_tests: [unique, not_null]
      - name: person_key
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_persons')
                field: person_key
  - name: stg_deal_qualification
    description: Explicit synthetic rep decisions, separate from meeting attendance.
    columns:
      - name: decision_id
        data_tests: [unique, not_null]
      - name: deal_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_deals')
                field: deal_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [qualified, unqualified]
  - name: stg_quality_issues
    columns:
      - name: issue_id
        data_tests: [unique, not_null]
  - name: stg_engagement_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
  - name: int_person_resolution
    columns:
      - name: person_key
        data_tests: [unique, not_null]
  - name: int_qualified_pipeline
    columns:
      - name: deal_id
        data_tests: [unique, not_null]
  - name: mart_qualified_pipeline
    description: Qualified pipeline created, open and won at campaign and currency grain.
    columns:
      - name: campaign_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
  - name: mart_crm_health_v21
    description: Passing and eligible denominators for four transparent CRM health components.
    columns:
      - name: component
        data_tests: [unique, not_null]
  - name: stg_campaigns
    description: Normalized synthetic campaign registry, retaining invalid names for audit.
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: spend_cents
        data_tests: [not_null]
  - name: stg_contacts
    description: CRM contacts after trimming and normalizing email for duplicate detection.
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
  - name: stg_legacy_contacts
    description: Original CRM snapshot before synthetic migration defects.
    columns:
      - name: legacy_id
        data_tests: [unique, not_null]
  - name: stg_content_items
    description: Synthetic YouTube content catalog with platform views and clicks.
    columns:
      - name: content_id
        data_tests: [unique, not_null]
  - name: stg_content_engagements
    description: Identifiable content engagement linked to a contact and tracking touch.
    columns:
      - name: engagement_id
        data_tests: [unique, not_null]
      - name: content_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_content_items')
                field: content_id
      - name: contact_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
  - name: stg_experiments
    columns:
      - name: experiment_id
        data_tests: [unique, not_null]
  - name: stg_experiment_variants
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: experiment_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_experiments')
                field: experiment_id
  - name: stg_experiment_exposures
    columns:
      - name: exposure_id
        data_tests: [unique, not_null]
      - name: variant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_experiment_variants')
                field: variant_id
      - name: contact_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
  - name: stg_subscriptions
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
  - name: stg_renewal_attempts
    columns:
      - name: attempt_id
        data_tests: [unique, not_null]
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
  - name: stg_ad_spend_daily
    description: Daily paid media spend at campaign and date grain.
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id
      - name: spend_date
        data_tests: [not_null]
  - name: stg_touches
    description: Acquisition and return touches with registry and eligibility flags.
    columns:
      - name: touch_id
        data_tests: [unique, not_null]
      - name: contact_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
  - name: stg_lifecycle_events
    columns:
      - name: lifecycle_event_id
        data_tests: [unique, not_null]
  - name: stg_deals
    columns:
      - name: deal_id
        data_tests: [unique, not_null]
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [succeeded, failed]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [new, installment, renewal]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
  - name: stg_refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: payment_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_payments')
                field: payment_id
  - name: int_payment_cash
    description: One row per successful payment with refunds netted against that payment.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: int_lead_touch
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
  - name: mart_attribution_lead_creation
    description: Payment-level net cash credit for the most recent eligible lead-creation touch.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: mart_campaign_performance
    description: Paid and organic campaign counts plus attributed net collected cash.
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
  - name: mart_revenue
    description: Booked deal value, gross cash, refunds, and net cash as distinct metrics.
  - name: mart_growth_daily
    description: Event-date growth facts. Cash refunds appear on the refund date; this is not acquisition-cohort ROAS.
    columns:
      - name: day
        data_tests: [unique, not_null]
  - name: mart_funnel
    description: Stage counts and adjacent-stage conversion based on lifecycle history.
    columns:
      - name: stage
        data_tests: [unique, not_null]
  - name: mart_measurement_health
    description: Counts behind UTM, campaign, ownership, lifecycle, and cash match health rates.
  - name: mart_migration_audit
    description: Legacy-to-current contact match and discrepancy flags at legacy ID grain.
    columns:
      - name: legacy_id
        data_tests: [unique, not_null]
  - name: mart_migration_summary
    description: Aggregate migration reconciliation with missing, owner, source, stage, and duplicate rates.
  - name: mart_content_performance
    description: Content views/clicks and first-content influenced lead-to-cash outcomes.
    columns:
      - name: content_id
        data_tests: [unique, not_null]
  - name: mart_experiment_variants
    description: Visitor-level CTA experiment outcomes with cash as the primary metric.
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
  - name: mart_renewal_risk
    description: Fixed synthetic as-of renewal queue; read-only, no provider retries.
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]
  - name: stg_platform_conversions
    description: Purchase conversions each ad platform credits to itself, at pixel (contract) value.
    columns:
      - name: conversion_id
        data_tests: [unique, not_null]
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: [meta, google, linkedin]
      - name: contact_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
  - name: int_duplicate_contacts
    description: Contacts that share a normalized email with a surviving (migrated or earliest) record.
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
  - name: mart_revenue_bridge
    description: CRM closed-won value to gross collected to net collected cash, one named step per row.
    columns:
      - name: step
        data_tests: [unique, not_null]
  - name: mart_platform_comparison
    description: Ad-platform self-reported conversion value versus warehouse lead-creation net cash, by platform.
    columns:
      - name: platform
        data_tests: [unique, not_null]
  - name: stg_email_campaigns
    description: Email sends with delivery, open (incl. machine opens), click, unsubscribe and complaint counts.
    columns:
      - name: email_id
        data_tests: [unique, not_null]
  - name: stg_short_links
    description: Short links (Bitly-style) with UTM parameters parsed from the destination URL.
    columns:
      - name: link_id
        data_tests: [unique, not_null]
  - name: stg_short_link_clicks
    columns:
      - name: link_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_short_links')
                field: link_id
  - name: mart_email_performance
    description: Per-send email performance; human opens exclude privacy-proxy machine opens.
    columns:
      - name: email_id
        data_tests: [unique, not_null]
  - name: mart_link_hygiene
    description: Short links checked against the campaign registry (missing, unregistered or off-taxonomy UTMs).
    columns:
      - name: link_id
        data_tests: [unique, not_null]
  - name: mart_paid_efficiency_daily
    description: Paid campaign activity by UTC day (spend, delivery, leads, MQLs, booked calls, wins) for date-range efficiency metrics.
    columns:
      - name: day
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]
