[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthops-os"
version = "0.3.0"
description = "Marketing measurement, revenue reconciliation, diagnostics and lifecycle automation on a synthetic B2B scenario"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff==0.16.8"]
warehouse = ["dbt-core>=1.10,<2", "dbt-duckdb>=1.9,<2", "openpyxl>=3.1,<4"]
rag = ["onnxruntime>=1.29,<2", "tokenizers>=0.23.1,<1", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["growthops*"]

[tool.setuptools.package-data]
growthops = ["sql/*.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Run from its own environment (CI job "types"): mypy's pathspec floor conflicts with dbt-core's pin.
files = ["growthops"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
