name: GrowthOps checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,warehouse]" -r requirements.txt
      - name: Lint
        run: python -m ruff check --isolated growthops tests streamlit_app.py
      - name: Unit, invariant and ground-truth tests (coverage gate 80%)
        run: |
          python -m pip install pytest-cov
          python -m pytest -q --cov=growthops --cov-report=term --cov-fail-under=80
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off --skip-editable
      - name: Narrative guardrail eval (30 labelled cases)
        run: python -m growthops.narrator --eval
      - name: Cache the local embedding model (checksum-verified on load)
        uses: actions/cache@v6
        with:
          path: ~/.cache/growthops/models
          key: minilm-onnx-913d7300
      - name: Ask-your-data question contract, keyword and hybrid (zero wrong answers)
        run: |
          python -m growthops.embeddings
          python -m growthops.ask_data --eval
      - name: Streamlit app renders every view without an exception
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("streamlit_app.py").run(timeout=180)
          assert not app.exception, app.exception
          assert len(app.tabs) == 10
          app.text_input[0].input("Which revenue number is right?").run(timeout=60)
          assert not app.exception, app.exception
          # A suggested question and its first follow-up both answer, with no exception.
          app.button(key="ask-clear").click().run(timeout=60)
          next(b for b in app.button if (b.key or "").startswith("suggest-")).click().run(timeout=60)
          assert not app.exception and app.text_input[0].value, app.exception
          next(b for b in app.button if (b.key or "").startswith("follow-")).click().run(timeout=60)
          assert not app.exception, app.exception
          PY
      - name: Seed, build SQL marts and report
        run: |
          python -m growthops.seed --database data/growthops-sample.db
          python -m growthops.warehouse --database data/growthops-sample.db
          python -m growthops.report --database data/growthops-sample.db > /dev/null
          python -m growthops.export_warehouse --database data/growthops-sample.db
      - name: dbt seed and build (models + data tests)
        working-directory: warehouse/dbt
        run: |
          dbt seed --profiles-dir . --quiet --full-refresh
          dbt build --profiles-dir . --select path:models path:tests --quiet
      - name: DuckDB/dbt parity with the Python reference
        run: python -m growthops.verify_dbt
      - name: Committed BI snapshot, Power BI project and measure reference are current
        run: |
          python -m growthops.export_bi --refresh-pbip
          python -m growthops.bi.build_pbip --check
          python -m growthops.export_excel --output "$RUNNER_TEMP/workbook.xlsx"
          git diff --exit-code -- dashboards/ docs/power-bi-measures.md ':(exclude)dashboards/GrowthOps_OS_Excel_Dashboard.xlsx' || (echo "::error::BI artifacts are stale. Run export_bi --refresh-pbip and export_excel --recalculate." && exit 1)

  types:
    # Separate from "test": mypy needs pathspec>=1 and dbt-core pins it below 0.13, so they cannot share an env.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt mypy==2.3.1
      - name: Type check (mypy, zero errors)
        run: python -m mypy

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config --quiet
      - name: Build the image (downloads and verifies the embedding model)
        run: docker build -t growthops-os .
      - name: Production refuses unsafe settings; synthetic API serves behind a key
        run: |
          docker volume create gdata
          docker run --rm -v gdata:/data growthops-os python -m growthops.seed --database /data/growthops.db --scale 0.2
          if docker run --rm -v gdata:/data -e GROWTHOPS_ENV=production growthops-os \
               python -c "from growthops.config import get_settings; get_settings().require_safe()"; then
            echo "::error::production accepted unsafe defaults"; exit 1
          fi
          docker run -d --name api -p 8000:8000 -v gdata:/data --read-only --tmpfs /tmp \
            -e GROWTHOPS_ENV=development -e GROWTHOPS_DATA_MODE=synthetic \
            -e GROWTHOPS_WEBHOOK_SECRET=$(openssl rand -hex 32) \
            -e GROWTHOPS_API_KEYS=ci-key-0123456789abcdefghij growthops-os
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/ready | python -c "import json,sys; body=json.load(sys.stdin); assert body['status']=='ready' and not body['stale_sources'], body"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/metrics/funnel)" = "401"
          # A question that has to go through retrieval, so this proves the image's MiniLM model is live.
          # (A question whose details decide it, like "what does a lead cost on Google", skips retrieval.)
          curl -fs -H "X-API-Key: ci-key-0123456789abcdefghij" "localhost:8000/ask?q=did%20anyone%20pay%20and%20not%20get%20into%20the%20community" \
            | python -c "import json,sys; body=json.load(sys.stdin); assert body['retrieval_mode']=='hybrid' and body['route']=='metric', body"
          curl -fs -H "X-API-Key: ci-key-0123456789abcdefghij" "localhost:8000/ask?q=What%20does%20a%20lead%20cost%20on%20Google" \
            | python -c "import json,sys; body=json.load(sys.stdin); assert body['metric_id']=='paid_efficiency' and body['answer'].startswith('Google,'), body"
          docker logs api | tail -5
